name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test with coverage
        run: yarn test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Build
        run: yarn build

      - name: Generate static output
        run: yarn generate

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs and Dependabot runs do not receive Actions secrets, so Percy cannot run for them.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate static output
        run: yarn generate

      # Percy exits 0 when the token is missing, which would look like a pass.
      - name: Percy visual snapshots
        run: |
          if [ -z "$PERCY_TOKEN" ]; then
            echo "::warning title=Percy skipped::PERCY_TOKEN secret is not set; no visual snapshots were uploaded."
            exit 0
          fi
          yarn percy
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
